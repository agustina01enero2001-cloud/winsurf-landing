# Winsurf landing — Next.js on 127.0.0.1:3005
# IMPORTANT: do NOT use apex recash routes or ports 3001 / 5432 (RECASH).
# Domain: landing.titanes.site (DNS A → 187.127.53.50)
# HTTPS: certbot --nginx -d landing.titanes.site

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  server_name landing.titanes.site;

  client_max_body_size 110m;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  location / {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/landing.titanes.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/landing.titanes.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = landing.titanes.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  server_name landing.titanes.site;
    return 404; # managed by Certbot


}